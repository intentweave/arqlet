lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      '@arqlet/engine-client':
        specifier: workspace:*
        version: link:packages/engine-client
      '@arqlet/viewer':
        specifier: workspace:*
        version: link:packages/viewer

  apps/playground:
    dependencies:
      '@arqlet/contracts':
        specifier: workspace:*
        version: link:../../packages/contracts
    devDependencies:
      typescript:
        specifier: 7.0.2
        version: 7.0.2

  examples/react-flow:
    dependencies:
      '@arqlet/engine-client':
        specifier: workspace:*
        version: link:../../packages/engine-client
      '@arqlet/viewer':
        specifier: workspace:*
        version: link:../../packages/viewer
      '@xyflow/react':
        specifier: ^12.0.0
        version: 12.12.0(react-dom@19.3.1(react@19.3.1))(react@19.3.1)
      react:
        specifier: ^19.0.0
        version: 19.3.1
      react-dom:
        specifier: ^19.0.0
        version: 19.3.1(react@19.3.1)
    devDependencies:
      vite:
        specifier: ^7.0.0
        version: 7.3.7

  packages/arqlet:
    dependencies:
      '@arqlet/contracts':
        specifier: workspace:^
        version: link:../contracts
      '@arqlet/engine-client':
        specifier: workspace:^
        version: link:../engine-client
      '@arqlet/viewer':
        specifier: workspace:^
        version: link:../viewer
    devDependencies:
      typescript:
        specifier: 7.0.2
        version: 7.0.2

  packages/containment-tree: {}

  packages/contracts:
    devDependencies:
      typescript:
        specifier: 7.0.2
        version: 7.0.2

  packages/engine-client:
    dependencies:
      '@arqlet/contracts':
        specifier: workspace:^
        version: link:../contracts

  packages/viewer:
    dependencies:
      '@arqlet/contracts':
        specifier: workspace:^
        version: link:../contracts

