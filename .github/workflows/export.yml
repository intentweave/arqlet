name: Export package checks
on:
  # A pull request is checked as a pull request; a branch push without one is not built twice. `main` after a merge.
  push:
    branches: [main]
  pull_request:
# A newer push to a pull request stops its older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: tools/intentweave-export
