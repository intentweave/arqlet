name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable check --workspace --locked
      # Tests read the benchmark datasets, which are generated (git-ignored): deterministic, standard library only.
      - run: python3 benchmarks/generate.py --no-manifest
      # The fixtures of the Cypher query layer (ADR 0021): the cases and the graph hashes must match the oracle.
      - run: python3 examples/cypher/oracle.py --check
      - run: cargo +stable test --workspace --locked
      - run: rustup target add wasm32-unknown-unknown --toolchain stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # ADR 0021, item 12: the query crates stay free of the layout engine (and the guard catches a violation).
      - run: node tools/check-query-isolation.mjs
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: node --test tools/check-query-isolation.test.mjs
        env:
          RUSTUP_TOOLCHAIN: stable
      # The workspace must be installed before build.sh: its Node tests import @arqlet/* by package name.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: sh apps/playground/build.sh examples/fixtures/small.json
      - run: pnpm --filter @arqlet/contracts run typecheck
      - run: pnpm --filter @arqlet/playground run typecheck
      # The hand-written declarations of the published npm packages.
      - run: pnpm --filter arqlet run typecheck
      - run: pnpm --filter arqlet-react-flow-example run build
      # The license notices of the crates linked into the WASM engine: its npm package ships them.
      - run: node --test tools/third-party-notices.test.mjs
        env:
          RUSTUP_TOOLCHAIN: stable
  # The declared minimum Rust version (`rust-version` in Cargo.toml) must keep building the workspace.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.94.0 check --workspace --locked
      # The browser adapter is built for WASM; check it with the minimum version too.
      - run: cargo +1.94.0 check -p arqlet-wasm --target wasm32-unknown-unknown --locked
