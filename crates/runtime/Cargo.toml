[package]
name = "arqlet-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
description = "Arqlet engine runtime: JSON dispatcher, snapshots, revisioned patches, incremental scheduling and refinement."
# The integration tests are modules of one test binary (`tests/all.rs`).
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[features]
benchmark-timings = ["arqlet-layout/benchmark-timings"]

[dependencies]
arqlet-model = { workspace = true }
arqlet-layout = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
arqlet-scene = { workspace = true }
arqlet-view = { workspace = true }
arqlet-reference = { workspace = true }
arqlet-elk = { workspace = true }

[dev-dependencies]
arqlet-routing = { workspace = true }
