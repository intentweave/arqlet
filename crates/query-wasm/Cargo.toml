[package]
name = "arqlet-query-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Provisional (ADR 0021, M5c): a query-only WASM module (lw_alloc, lw_free, lw_run with JSON payloads) without the layout engine."

[lib]
crate-type = ["cdylib", "rlib"]

# The query layer and the graph part of the model; no layout, routing, scene, view, runtime or engine crate
# (`tools/check-query-isolation.mjs`).
[dependencies]
arqlet-model = { workspace = true }
arqlet-query-json = { workspace = true }
arqlet-query-model = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
