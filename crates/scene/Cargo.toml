[package]
name = "arqlet-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
description = "Renderer-independent scene geometry, labels, metrics and spatial queries for Arqlet layouts."

[dependencies]
ts-rs = { version = "=12.0.1", optional = true }
arqlet-model = { workspace = true }
serde = { version = "1", features = ["derive"] }

[features]
ts = ["dep:ts-rs"]
benchmark-pairs = []

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[[example]]
name = "metric-pairs"
required-features = ["benchmark-pairs"]
