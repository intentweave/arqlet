[package]
name = "arqlet-model"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
description = "Canonical graph identities, revisions, nested containers, ports and logical edges."

[dependencies]
ts-rs = { version = "=12.0.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Portable math (sin, cos, atan2, powf, hypot): the same results on every platform and in WASM (see src/math.rs).
libm = "=0.2.16"

[features]
ts = ["dep:ts-rs"]
